<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or 'Connect Four' }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><nav><a class="brand" href="{{ url_for('dashboard') if g.user else url_for('login') }}">● Connect Four</a>
{% if g.user %}<span>{{ g.user['username'] }}</span><a href="{{ url_for('dashboard') }}">My games</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet">Log out</button></form>{% endif %}
</nav></header>
<main>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="message" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main>
</body></html>

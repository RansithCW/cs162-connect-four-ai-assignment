{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Register' if mode == 'register' else 'Log in' }}</h2>
<form method="post" class="account-form">
  <label>Username <input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
  <label>Password <input name="password" type="password" required minlength="8" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label>
  <button>{{ 'Create account' if mode == 'register' else 'Log in' }}</button>
</form>
<p>{% if mode == 'register' %}Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
{% else %}Need an account? <a href="{{ url_for('auth.register') }}">Register</a>{% endif %}</p>
{% endblock %}
